<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Outdoor shop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header"><h1>Outdoor shop</h1></header>
  <main>
    <section class="cards">
      <article class="card">
        <h3>Trail runner</h3>
        <p>Light shoe for rocky ground with a firm heel.</p>
        <span class="badge">New</span>
      </article>
      <article class="card">
        <h3>Rain shell</h3>
        <p>Packs into its own pocket and seals at the cuffs.</p>
        <span class="badge">Best seller</span>
      </article>
      <article class="card">
        <h3>Day pack</h3>
        <p>Twenty litres, padded straps, a sleeve for water.</p>
        <span class="badge">Back in stock</span>
      </article>
    </section>
  </main>
  <footer class="site-footer">Free returns within 30 days. Questions? Write to the shop.</footer>
</body>
</html>
