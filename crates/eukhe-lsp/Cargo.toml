[package]
name = "eukhe-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Language-server client, server table, pool, and diagnostics for Eukhe."

[dependencies]
eukhe-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# Non-poisoning locks for the pool and client state (owner-approved).
parking_lot = "0.12"
# file:// URI <-> path conversion with percent-encoding (already in the
# dependency graph through reqwest).
url = { version = "2", features = ["serde"] }

[dev-dependencies]
tempfile = "3"

# The fake language server the integration tests drive (no network, no
# real servers). Never shipped: the release builds only `eukhe`.
[[bin]]
name = "eukhe-lsp-fake-server"
path = "tests/support/fake_server.rs"
test = false
doc = false

[lints]
workspace = true
