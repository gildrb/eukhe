[package]
name = "eukhe-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Embed the Eukhe session engine in-process"

[dependencies]
# The engine the facade opens: sessions, their config and models.
eukhe-core = { path = "../eukhe-core" }
# A session's conversations, their submissions and event stream.
eukhe-durable.workspace = true
# The model collection and its auth-checked listing.
eukhe-ai.workspace = true
# The contexts every engine call takes (cancellation, deadlines).
eukhe-chord.workspace = true
# The model type a listing answers.
eukhe-types.workspace = true
anyhow.workspace = true
futures.workspace = true
# The event channel and the budget watch (`sync`); the budget ledger's
# file IO runs on the blocking pool (`rt`).
tokio = { workspace = true, features = ["rt", "sync"] }
# New session ids (UUIDv7, the engine's session id form).
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
# The integration test's faux script and event JSON.
serde_json.workspace = true
# The integration test's agent dir and cwd.
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
