[package]
name = "eukhe-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Session engine: tools, skills, prompts, kernel, subagents, settings."

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
thiserror.workspace = true
tracing.workspace = true
eukhe-types.workspace = true
eukhe-models = { path = "../eukhe-models" }
# The eukhe agent on the durable Harness (`durable` module): the Harness,
# its pi-ai model layer, and chord contexts/JSON.
eukhe-durable.workspace = true
eukhe-ai.workspace = true
eukhe-chord.workspace = true
eukhe-docs = { path = "../eukhe-docs" }
# The `bash` tool's in-process interpreter and approval gate.
eukhe-shell.workspace = true
base64 = "0.22"
fancy-regex = "0.14"
# The traces browser login's auth challenge (RSA-2048 keypair, OAEP-SHA256
# result decrypt; sha2 matches the workspace's version, pem for the SPKI
# wire form).
rsa = { version = "0.9", features = ["sha2", "pem"] }
libc = "0.2"
# platform: signals, sessions, rlimits, pidfd polling, lock-dir mtimes and
# the macOS kqueue exit watch through safe wrappers. MIT.
nix = { version = "0.29", features = ["signal", "process", "user", "fs", "dir", "resource", "poll", "event"] }
# platform/local_time: the instant in the process time zone (`TZ`, else
# the system zone) without libc's unsafe `localtime_r`. Unlicense OR MIT.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "v7"] }
sha1 = "0.10"
sha2 = "0.10"
getrandom = "0.3"
url = "2"
globset = "0.4"
toml.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
unicode-normalization = "0.1"
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
ignore = "0.4"

# platform/process: pidfd_open/pidfd_send_signal, which nix does not
# wrap; child_workspace: FICLONE extent clones. Already in the graph
# through eukhe-ai. MIT OR Apache-2.0.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["process", "fs"] }

# platform/process: `kern.maxfilesperproc` through a safe sysctl
# wrapper. MIT. child_workspace: clonefile extent clones through rustix
# (already in the graph through tempfile). MIT OR Apache-2.0.
[target.'cfg(target_os = "macos")'.dependencies]
sysctl = "0.7"
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
# The Bend bridge harness (`eukhe_durable::testing::bridge`).
eukhe-durable = { workspace = true, features = ["testing"] }
tempfile = "3"
proptest = { workspace = true }
# The traces rate-gate test runs on paused tokio time (the 12s platform
# interval auto-advances).
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
