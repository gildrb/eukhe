[package]
name = "eukhe-durable"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Rust port of @earendil-works/pi-durable 1.0.4 with parts of 1.1 and 1.2: a durable agent harness."

[dependencies]
eukhe-chord.workspace = true
eukhe-ai.workspace = true
eukhe-types.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
# env/native: process-group kill, statfs magic, inotify (Linux) and kqueue
# (macOS) watches through safe wrappers (rustix's kevent is unsafe). MIT.
nix = { version = "0.29", features = ["signal", "fs", "inotify", "event"] }
# env/native: `file://` path arguments, like Node's `fileURLToPath`. MIT OR Apache-2.0.
url = "2"
percent-encoding = "2"
# env/native: `createTempFile` names, like Node's `randomUUID()`. Apache-2.0 OR MIT.
uuid = { version = "1", features = ["v4"] }
# env/native_watch: content hashes of recently modified files in polling mode. MIT OR Apache-2.0.
sha2 = "0.10"
# tools/edit_diff, tools/path_utils: JS `String.prototype.normalize` (NFKC, NFD). MIT OR Apache-2.0.
unicode-normalization = "0.1.25"
# storage/sqlite/native: SQLite connection for the native durable storage
# adapter (Node's `node:sqlite` analog), with a bundled SQLite build. MIT.
rusqlite = { version = "0.40", features = ["bundled"] }
# harness/scheduler: the live task mirror and other scheduler maps keep JS
# `Map`/`Set` insertion order. Apache-2.0 OR MIT.
indexmap = "2"
# codemode/sandbox: the QuickJS VM code mode scripts run in, as upstream's
# pi-codemode: deterministic (it runs only when the host delivers a result,
# with no I/O or timers), so a script replays after a restart. Bundles and
# builds QuickJS-ng with `cc`, like rusqlite's bundled SQLite. MIT.
rquickjs = "0.14"
# codemode/output: decode `image()` data to save it (TS `atob`). Already in the
# graph through eukhe-ai. MIT OR Apache-2.0.
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
# Paused tokio time for the task sleep tests (TS real timers against an
# injected Harness clock). MIT.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
