[package]
name = "eukhe-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The eukhe binary."

[dependencies]
eukhe-types = { path = "../eukhe-types" }
eukhe-theme = { path = "../eukhe-theme" }
eukhe-build-info = { path = "../eukhe-build-info" }
eukhe-core = { path = "../eukhe-core" }
eukhe-models = { path = "../eukhe-models" }
eukhe-daemon = { path = "../eukhe-daemon" }
eukhe-tui = { path = "../eukhe-tui" }
eukhe-gateway = { path = "../eukhe-gateway" }
eukhe-dashboard = { path = "../eukhe-dashboard" }
# S9 local tiny models: `tiny-models`, `translate`, `say`, `transcribe`,
# and the hidden `tiny-worker` entry (the ONNX engine, run-time dlopen).
eukhe-tiny = { path = "../eukhe-tiny" }
eukhe-tiny-onnx = { path = "../eukhe-tiny-onnx" }
# The durable agent session the print/json/rpc modes run on (submissions,
# event streams, faux-script models, chord contexts).
eukhe-durable = { workspace = true }
eukhe-ai = { workspace = true }
eukhe-chord = { workspace = true }
futures = { workspace = true }
uuid = { version = "1", features = ["v7"] }
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The subscription logins' paste validation (the authorization URL's state,
# the code query the flow receives).
url = "2"
tracing = { workspace = true }
# `eukhe gateway` and `eukhe dashboard` are long-running foreground modes:
# their log lines (tracing events) go to stderr.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
# The binary's global allocator (see the workspace manifest).
mimalloc.workspace = true

[[bin]]
name = "eukhe"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
base64 = "0.22"
# The Prime Inference login tests encrypt the challenge result with the
# flow's own public key (same versions the workspace resolves for the engine).
rsa = { version = "0.9", features = ["sha2", "pem"] }
sha2 = "0.10"
# Safe libc types/constants only (the pty harness's termios snapshot, signal
# numbers); the syscalls go through nix/rustix.
libc = "0.2"
futures = { workspace = true }
crossterm = "0.28"
nix = { version = "0.29", features = ["term", "signal", "fs", "socket"] }
# The safe calls nix lacks: TIOCSCTTY (the pty child's controlling-terminal
# claim), PR_SET_PDEATHSIG (the daemon trampoline), and ptsname; and the
# shared e2e `Daemon` guard's pidfd tree kill and wait.
rustix = { version = "1", features = ["process", "pty", "event"] }

[lints]
workspace = true
