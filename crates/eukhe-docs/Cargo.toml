[package]
name = "eukhe-docs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Documents: file tags, edit store, read projection, locked writes, hashline edits, grep, glob."

[dependencies]
# The path policy: every path a document tool reads or writes is judged
# on its real path (eukhe_types::path_policy::resolve), as the shell's.
eukhe-types.workspace = true
thiserror.workspace = true
# The edit store is shared by the wire `edit` tool and the kernel requests
# of one session.
parking_lot = "0.12"
# The hashline grammar and teaching repairs are omp's regexes.
regex = "1"
# The file tag is omp's xxh32 (seed 0) of the normalized text; MIT, unlike
# xxhash-rust (BSL-1.0).
twox-hash = { version = "2", default-features = false, features = ["std", "xxhash32", "xxhash64"] }
# The byte rebase is omp's deadline-bounded Myers diff (`capture_diff_slices_deadline`).
similar = "3"
# grep and glob walk the tree as ripgrep does: gitignore-aware, path-ordered.
ignore = "0.4"
# Walk filters are omp's literal-separator globs.
globset = "0.4"
# grep matches with ripgrep's Rust regex engine; the searcher merges
# overlapping match context so a line is shown once.
grep-regex = "0.1"
grep-searcher = "0.1"

[dev-dependencies]
# omp's hashline parity fixtures are JSON.
serde_json.workspace = true
tempfile = "3"

[lints]
workspace = true
