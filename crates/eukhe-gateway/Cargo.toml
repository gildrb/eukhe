[package]
name = "eukhe-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Signal gateway for Eukhe: chat with the CLI session from a phone."

[dependencies]
eukhe-types = { path = "../eukhe-types" }
# The table layout runs as the compiled Bend core (bend/ffi_gateway_width.bend).
eukhe-bend.workspace = true
# The daemon-wire client (`eukhe_client::daemon_client::DaemonClient`).
eukhe-client = { path = "../eukhe-client" }
# Only for `width::str_width`: the reply tables measure text the way the
# terminal does, and terminal text measurement stays in the TUI.
eukhe-tui = { path = "../eukhe-tui" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# A fresh admission id per prompt.
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
