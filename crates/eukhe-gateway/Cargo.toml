[package]
name = "eukhe-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Signal gateway for Eukhe: chat with the CLI session from a phone."

[dependencies]
eukhe-types = { path = "../eukhe-types" }
# The public daemon-wire client (`eukhe_tui::daemon_client::DaemonClient`).
eukhe-tui = { path = "../eukhe-tui" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# A fresh admission id per prompt.
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# The bridge test's temp dir (`testing::compare`).
tempfile = "3"

[lints]
workspace = true
