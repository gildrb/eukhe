[package]
name = "eukhe-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Session supervisor, worker processes, and wire protocol."

[dependencies]
eukhe-types = { path = "../eukhe-types" }
eukhe-core = { path = "../eukhe-core" }
eukhe-agent = { path = "../eukhe-agent" }
eukhe-ai = { path = "../eukhe-ai" }
eukhe-telemetry = { path = "../eukhe-telemetry" }
# The session worker hosts the eukhe agent on the durable Harness
# (`eukhe-durable`, the pi-durable port) with `eukhe-pi-ai` models and
# `eukhe-chord` contexts/JSON.
eukhe-durable = { path = "../eukhe-durable" }
eukhe-chord = { path = "../eukhe-chord" }
eukhe-pi-ai = { path = "../eukhe-pi-ai" }
anyhow = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = "0.7"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
filetime = "0.2"
tempfile = "3"
# Test-only: `ModelCatalog::with_urls` + the compiled offline Prime
# Inference entries build the loopback catalog the session-model restore
# tests script (the eukhe-core tests/common pattern, in-crate), and the
# catalog-repo child-resolution regression writes the layer-A disk cache
# in the eukhe-models snapshot shape; the crate's runtime surface goes
# through eukhe-core.
eukhe-models = { path = "../eukhe-models" }
url = "2"
# The MCP catalog e2e seeds the fetch lane's snapshot envelope: the real
# catalog url/scope constants keep the seeded cache byte-honest.
# `test-util` (tokio time pause) is test-only: the mutation-drain latch test
# drives real timeouts through the paused clock.
tokio = { workspace = true, features = ["test-util"] }

[[bin]]
name = "eukhe-daemon"
path = "src/main.rs"

[lints]
workspace = true
