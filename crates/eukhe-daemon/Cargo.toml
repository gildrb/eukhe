[package]
name = "eukhe-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Session supervisor, worker processes, and wire protocol."

[dependencies]
eukhe-types = { path = "../eukhe-types" }
# The compiled Bend core: the orphan exit and the restart budget.
eukhe-bend = { path = "../eukhe-bend" }
eukhe-theme = { path = "../eukhe-theme" }
# The build identity the supervisor's hello reports (`runtime.buildId`).
eukhe-build-info = { path = "../eukhe-build-info" }
eukhe-core = { path = "../eukhe-core" }
eukhe-docs = { path = "../eukhe-docs" }
# The session worker hosts the eukhe agent on the durable Harness
# (`eukhe-durable`, the pi-durable port) with `eukhe-ai` models and
# `eukhe-chord` contexts/JSON.
eukhe-durable = { path = "../eukhe-durable" }
eukhe-chord = { path = "../eukhe-chord" }
eukhe-ai = { path = "../eukhe-ai" }
anyhow = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = "0.7"
tracing.workspace = true
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "v7"] }
# The binary's global allocator (see the workspace manifest).
mimalloc.workspace = true

[dev-dependencies]
filetime = "0.2"
# The Bend bridge harness (`eukhe_durable::testing::bridge`).
eukhe-durable = { path = "../eukhe-durable", features = ["testing"] }
tempfile = "3"
socket2 = "0.6"
# The supervisor property suite draws sibling rosters for the live
# rename ladder; the plain std features are enough (no fork/timeout).
proptest = { workspace = true }
url = "2"
# `test-util` (tokio time pause) is test-only: the mutation-drain latch test
# drives real timeouts through the paused clock.
tokio = { workspace = true, features = ["test-util"] }
# The e2e `Daemon` guard pins and kills the supervisor's process tree
# (pidfd, process groups) and waits on the pidfds.
rustix = { version = "1", features = ["process", "event"] }

[[bin]]
name = "eukhe-daemon"
path = "src/main.rs"

[lints]
workspace = true
