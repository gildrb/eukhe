[package]
name = "eukhe-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Session supervisor, worker processes, and wire protocol."

[dependencies]
eukhe-types = { path = "../eukhe-types" }
# The build identity the supervisor's hello reports (`runtime.buildId`).
eukhe-build-info = { path = "../eukhe-build-info" }
eukhe-core = { path = "../eukhe-core" }
# The session worker hosts the eukhe agent on the durable Harness
# (`eukhe-durable`, the pi-durable port) with `eukhe-ai` models and
# `eukhe-chord` contexts/JSON.
eukhe-durable = { path = "../eukhe-durable" }
eukhe-chord = { path = "../eukhe-chord" }
eukhe-ai = { path = "../eukhe-ai" }
anyhow = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = "0.7"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
filetime = "0.2"
tempfile = "3"
socket2 = "0.6"
# The supervisor property suite draws sibling rosters for the live
# rename ladder; the plain std features are enough (no fork/timeout).
proptest = { workspace = true }
url = "2"
# `test-util` (tokio time pause) is test-only: the mutation-drain latch test
# drives real timeouts through the paused clock.
tokio = { workspace = true, features = ["test-util"] }

[[bin]]
name = "eukhe-daemon"
path = "src/main.rs"

[lints]
workspace = true
