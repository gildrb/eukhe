[package]
name = "eukhe-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Desktop computer use for Eukhe: windows, screenshots, accessibility trees with stable refs, and typed input steps on one window."

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
# Screenshots leave the session as PNG. Already in the cargo registry the
# workspace uses; MIT OR Apache-2.0; pulls only crc32fast, fdeflate, flate2
# and miniz_oxide, which the graph already carries.
png = "0.18.1"
# `O_NOFOLLOW` for the input lock file (a constant, no calls). Already in
# the graph. MIT OR Apache-2.0.
libc = "0.2.189"

# The macOS backend's platform APIs (AX, Quartz events and window list,
# ScreenCaptureKit, NSWorkspace), all called from `macos::ffi` only. The
# objc2 family: MIT for objc2/block2, Zlib OR Apache-2.0 OR MIT for the rest.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFBase", "CFCGTypes", "CFDictionary", "CFNumber", "CFRunLoop", "CFMachPort", "CFString", "CFURL", "CFDate"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "libc", "CGError", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation", "CGWindow", "CGDirectDisplay", "CGDisplayConfiguration", "CGGeometry", "CGImage", "CGContext", "CGBitmapContext", "CGColorSpace", "CGSession"] }
objc2-application-services = { version = "0.3.2", default-features = false, features = ["std", "libc", "AXUIElement", "AXError", "AXValue", "AXValueConstants", "AXAttributeConstants", "AXActionConstants", "HIServices"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSError", "NSString", "NSURL", "NSDictionary", "NSValue", "NSBundle", "NSObject", "NSProcessInfo"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSRunningApplication", "NSWorkspace", "block2"] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "SCShareableContent", "SCScreenshotManager", "SCStream", "block2", "objc2-core-graphics", "objc2-core-foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
# X11 in pure Rust (no libxcb, no unsafe here): window list, Composite and
# screen capture, XTEST input, XInput 2 MPX pair and raw events, the
# screensaver idle time. MIT OR Apache-2.0.
x11rb = { version = "0.13.2", features = ["composite", "screensaver", "xinput", "xtest"] }
# AT-SPI proxies over D-Bus. MIT OR Apache-2.0.
atspi = { version = "0.30.0", default-features = false, features = ["proxies", "zbus"] }
# The D-Bus connection the proxies use; `blocking-api` gives the session
# worker thread blocking calls. MIT.
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
# Step and selector decoding tests read the JSON the tools send. Already in
# the graph.
serde_json = { workspace = true }

# The workspace lints, spelled out because Cargo cannot override one lint of
# `[lints] workspace = true`: identical but `unsafe_code = "deny"` (not
# "forbid"), so each backend's `ffi` module, the OS boundary, can carry the
# one narrow allow. Keep these tables equal to the root Cargo.toml's
# [workspace.lints].
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = "warn"
redundant_clone = "warn"
clone_on_copy = "warn"
assigning_clones = "warn"
unnecessary_to_owned = "warn"
uninlined_format_args = "warn"
collapsible_if = "warn"
redundant_closure_for_method_calls = "warn"
unnested_or_patterns = "warn"
unreadable_literal = "warn"
duration_suboptimal_units = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
single_match_else = "warn"
needless_continue = "warn"
items_after_statements = "warn"
if_not_else = "warn"
semicolon_if_nothing_returned = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
doc_markdown = "warn"
bool_to_int_with_if = "warn"
case_sensitive_file_extension_comparisons = "warn"
cloned_instead_of_copied = "warn"
default_trait_access = "warn"
elidable_lifetime_names = "warn"
enum_glob_use = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
format_collect = "warn"
format_push_string = "warn"
ignore_without_reason = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
manual_assert = "warn"
manual_assert_eq = "warn"
manual_instant_elapsed = "warn"
manual_is_variant_and = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
match_bool = "warn"
match_wildcard_for_single_variants = "warn"
needless_raw_string_hashes = "warn"
no_effect_underscore_binding = "warn"
nonminimal_bool = "warn"
overly_complex_bool_expr = "warn"
range_plus_one = "warn"
redundant_else = "warn"
return_self_not_must_use = "warn"
single_char_pattern = "warn"
stable_sort_primitive = "warn"
str_split_at_newline = "warn"
unicode_not_nfc = "warn"
unchecked_time_subtraction = "warn"
unnecessary_debug_formatting = "warn"
unnecessary_join = "warn"
unnecessary_literal_bound = "warn"
unnecessary_semicolon = "warn"
used_underscore_binding = "warn"
