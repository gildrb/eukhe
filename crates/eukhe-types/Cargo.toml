[package]
name = "eukhe-types"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Shared domain and wire types for Eukhe."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
libc = "0.2"
# platform: signals, the suspend's thread mask and stop, and the tty's
# termios through safe wrappers. MIT.
nix = { version = "0.29", features = ["signal", "process", "pthread", "term"] }
# platform/process: the suspend window's SIGINT shield (a handler that
# swallows or runs the default action) without unsafe `sigaction`.
# Already in the graph through crossterm. MIT OR Apache-2.0.
signal-hook = { version = "0.3", default-features = false }
socket2 = "0.6"
# The incident classifier's log-message patterns are the TS regexes
# (src/cli/incident.ts); the `regex` crate keeps their semantics 1:1.
regex = "1"
# pi_ai: ordered string maps (headers, env, thinking-level maps, prompt
# sections) keep JS object insertion order; the same crate backs
# serde_json's `preserve_order` Map.
indexmap = { version = "2", features = ["serde"] }

# platform/process: `proc_pidpath` for the lease holder's executable
# through a safe wrapper (darwin-libproc pins memchr ~2.3, which the
# graph cannot take). MIT.
[target.'cfg(target_vendor = "apple")'.dependencies]
libproc = "0.14"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
