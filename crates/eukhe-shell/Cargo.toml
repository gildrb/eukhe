[package]
name = "eukhe-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "In-process bash: the script interpreter, its coreutils, and the per-step approval gate of the bash tool."

[dependencies]
eukhe-types.workspace = true
# External steps run as child processes; the approval wait is async.
tokio = { workspace = true }
tracing.workspace = true
# A kill reaches every process an external step starts: its own process
# group, killed through a safe `killpg` (already in the graph). MIT.
nix = { version = "0.29", features = ["signal"] }
# `grep` runs ripgrep's engine in process (the crates eukhe-docs uses).
grep-regex = "0.1"
grep-searcher = "0.1"
# Pathname expansion matches one path segment with omp's glob syntax
# (the crate eukhe-docs uses).
globset = "0.4"

[dev-dependencies]
# The test approver's answer queue.
parking_lot = "0.12"
tempfile = "3"

[lints]
workspace = true
