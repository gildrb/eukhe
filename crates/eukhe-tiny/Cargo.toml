[package]
name = "eukhe-tiny"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Local tiny models: the pinned catalog, the explicit download, the shared worker and its election, role resolution."

[dependencies]
eukhe-build-info = { path = "../eukhe-build-info" }
# The pick and the election's run (and a started worker's seat) run as the
# compiled Bend core (bend/ffi_tiny.bend, bend/ffi_tiny_run.bend).
eukhe-bend.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
# `eukhe tiny-models download`: the only traffic of this crate, run by the
# user (same client and TLS stack as eukhe-ai: rustls, no native TLS).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
# Verifies each downloaded file against its pinned sha256 before install.
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
# The tests' worker children run without the agent dir variable.
eukhe-types = { workspace = true }

[lints]
workspace = true
