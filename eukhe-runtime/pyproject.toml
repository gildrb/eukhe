[project]
name = "eukhe-runtime"
version = "0.1.0"
description = "Kernel-side runtime shim for Eukhe recursion"
# The kernel runs on one pinned CPython on every machine
# (kernel-toolchain.json names the exact version and build); the lock below
# is resolved for that minor only.
requires-python = "==3.14.*"
# The kernel starts on the standard library alone: the runtime imports no
# package at start. `rlm.mcp` (mcp), the state snapshot (dill) and the skill
# CLI helper (tyro) import theirs on first use, which installs them from the
# lock like any other locked package.
dependencies = []

[dependency-groups]
# The runtime tests and the tests' kernel venv: the lazily imported
# packages the tests exercise, and the build backend of the editable skill
# installs of that venv.
dev = ["dill", "mcp>=2,<3", "pillow", "tyro", "hatchling", "editables"]
# Eukhe's package lock: every package a kernel may install, on demand, at
# one exact version with hashes (uv.lock, exported to
# requirements-kernel.txt by `make runtime-lock`). Nothing of it is
# installed until a cell imports it (`rlm/pip.py`); a package outside it
# goes through a project lock (`eukhe kernel lock <package>`).
kernel = [
  "dill",
  "requests",
  "httpx",
  "pyyaml",
  "tomli",
  "python-dotenv",
  "pandas",
  "numpy",
  "scipy",
  "beautifulsoup4",
  "lxml",
  "pydantic",
  "tyro",
  "pillow",
  "mcp>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlm"]
