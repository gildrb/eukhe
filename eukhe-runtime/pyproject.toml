[project]
name = "eukhe-runtime"
version = "0.1.0"
description = "Kernel-side runtime shim for Eukhe recursion"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2,<3",
  "tyro",
]

[dependency-groups]
dev = ["dill"]
# The kernel venv: everything the bootstrap installs besides the runtime
# itself, hash-locked in uv.lock and exported to requirements-kernel.txt
# (`make runtime-lock`). The bootstrap installs that export with
# `--require-hashes`, then this project with `--no-deps --no-index
# --no-build-isolation`, so hatchling (and every skill's build backend)
# must come from this group, never from an index at build time.
kernel = [
  "dill",
  "requests",
  "httpx",
  "pyyaml",
  "tomli",
  "python-dotenv",
  "pandas",
  "numpy",
  "scipy",
  "beautifulsoup4",
  "lxml",
  "pydantic",
  "tyro",
  "pillow",
  "hatchling",
  # hatchling's editable-install hook (skills install `--editable`).
  "editables",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlm"]
