# The CI gates as git hooks, run by prek (https://github.com/j178/prek,
# pinned there). GitHub runs no gate. `make hooks` installs
# them. Both run at low CPU priority (nice -n 10).
#
# pre-commit (< 1 min): `make ci-fast` (rustfmt, the secrets scan of the
# staged diff, the embedded JavaScript against its TypeScript sources when
# the staged change touches them, clippy on the crates the staged change
# touches).
# pre-push (< 5 min): .github/scripts/ci_local.py pre-push, on the pushed commits
# in this worktree: rustfmt, their secrets scan, clippy and the unit tests
# (no e2e suite) of the crates they touch, the compiled Bend core up to
# date (.github/scripts/bend_core.py check), the proofs the Bend change can reach
# (.github/scripts/bend_proofs.py), the embedded JavaScript up to date (`make
# embedded-js-check`), the dashboard UI (`make dashboard-ui`, when they
# touch crates/eukhe-dashboard/ui/), the vendored dependencies of the
# source build (`make nix-vendor`, when they touch Cargo.lock, the flake or
# nix/), the laws against LAWS.lock. No lock: every
# worktree pushes at any time. The full gate runs nightly
# (.github/scripts/ci_nightly.py).
# Skip rule: a push that changes only Markdown files at the repository
# root does not run the gate (the `exclude` below).
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: ci-fast
        name: ci-fast (fmt, secrets in the staged diff, embedded js, clippy on the touched crates)
        entry: nice -n 10 make --no-print-directory ci-fast
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: ci-push
        name: ci-push (fmt, secrets, clippy and unit tests on the touched crates, bend core check, the reached proofs, embedded js, dashboard ui, nix vendor, laws lock)
        entry: nice -n 10 python3 .github/scripts/ci_local.py pre-push
        language: system
        pass_filenames: false
        exclude: '^[^/]+\.md$'
        verbose: true
        stages: [pre-push]
