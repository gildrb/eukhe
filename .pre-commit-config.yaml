# The CI gates as git hooks, run by prek (https://github.com/j178/prek,
# pinned in docs/develop.md). GitHub runs no gate. `make hooks` installs
# them. Both run at low CPU priority (nice -n 10).
#
# pre-commit: `make ci-fast` (rustfmt, the secrets scan of the staged diff,
# clippy on the crates the staged change touches).
# pre-push: scripts/ci_local.sh pre-push, on the pushed commits in this
# worktree: rustfmt, their secrets scan, clippy and tests on the crates
# they touch, the compiled Bend core up to date (scripts/bend_core.py
# check), `bend PROOF.bend`. No lock: every worktree pushes at any
# time. The full gate runs nightly (scripts/ci_nightly.sh).
# Skip rule: a push that changes only Markdown files in docs/ or at the
# repository root does not run the gate (the `exclude` below).
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: ci-fast
        name: ci-fast (fmt, secrets in the staged diff, clippy on the touched crates)
        entry: nice -n 10 make --no-print-directory ci-fast
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: ci-push
        name: ci-push (fmt, secrets, clippy and tests on the touched crates, bend core check, bend PROOF.bend)
        entry: nice -n 10 scripts/ci_local.sh pre-push
        language: system
        pass_filenames: false
        exclude: '^(docs/.*|[^/]+)\.md$'
        verbose: true
        stages: [pre-push]
