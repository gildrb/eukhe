# cargo-deny configuration for the eukhe Rust workspace.
# Runs in the local full gate (`make ci-local`) and via `make deny`.

[graph]
all-features = true

[advisories]
version = 2
# Fail the build on any reachable vulnerability or withdrawn advisory.
yanked = "deny"
# Triaged exceptions — every entry must carry a reason and a review date;
# a landed fix upstream means the entry is removed instead of silenced.
ignore = [
  # eukhe-desktop's Linux backend reads AT-SPI over `atspi` 0.30, the latest
  # upstream, which pins the zbus 5 stack. zbus 6 absorbed these crates as
  # modules and atspi has not migrated. All three are maintenance notices,
  # not vulnerabilities: D-Bus marshalling toward the session's own
  # accessibility bus. They go when atspi moves to zbus 6 and the crates
  # leave the graph; until then, retriage by the review date.
  { id = "RUSTSEC-2026-0370", reason = "zvariant 5.x unmaintained, merged into zbus 6; retriage on the atspi zbus 6 migration, review 2027-05-24" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names 4.x unmaintained, merged into zbus 6; retriage on the atspi zbus 6 migration, review 2027-05-24" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5.x unmaintained, merged into zbus 6; retriage on the atspi zbus 6 migration, review 2027-05-24" },
]

[licenses]
version = 2
# Deny-by-default; the allowlist below is the exact set carried by the
# dependency graph (verified with `cargo deny check licenses`).
# The exact set carried by the dependency graph (verified with
# `cargo deny check licenses`); unmatched entries are removed on bump.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
]
# Development-only tools are not shipped; we keep the graph tight instead of
# adding private/exceptions stanzas.

[bans]
# Multiple versions of a crate are allowed (few genuine duplicates exist and
# cargo resolves them fine); duplicates and wildcards are surfaced instead.
multiple-versions = "warn"
wildcards = "deny"
# Version-less `path` dependencies between the workspace's own crates
# (all `publish = false`) are not registry wildcards; registry and git
# wildcards stay denied.
allow-wildcard-paths = true
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
# Everything comes from crates.io, except crossterm: the workspace patches it
# with its fork (root Cargo.toml [patch.crates-io], pinned by commit), the
# one git source allowed.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/gildrb/crossterm"]
