# CI gates for eukhe: fmt, `cargo check` + clippy --workspace --all-targets
# -- -D warnings, the sharded `cargo test --workspace` on the pinned
# toolchain (1.98.1), the eukhe-runtime Python suite, the dashboard UI,
# the Bend laws (`bend PROOF.bend`, `--verdict`) and the release-version
# bridge, the cargo-deny gate, and the secrets scan (gitleaks).
#
#   push to main — the light gate only: fmt, deny, secrets, laws. The
#   other gates ran before the push, in the local pre-push hook
#   (.githooks/pre-push: `make ci-local`, every gate of this file; `make
#   hooks` installs it). eukhe-release.yml releases, once a day, the newest
#   commit of main whose run of this workflow succeeded.
#
#   pull_request against main — the full gate set on the merge candidate.
#
#   merge_group — the full gate set and full workspace tests on the queued
#   merge candidate, not the PR's narrowed selection.
#
#   workflow_dispatch — the full gate set on a branch: catalog-pin.yml
#   starts it on the pull request it opens (a pull request the workflow
#   token opens starts no pull_request run).
#
# The full-gate jobs (changes, dashboard-ui, clippy-test, test-shard,
# test-summary, runtime-test) carry `github.event_name != 'push'`.
#
# THE PR SMOKE MODEL (the touched-crate path filter): the PR wave narrows
# the TEST phase to touched crates and their reverse dependents' units
# (the `changes` job maps the PR's changed files to crates; any path
# outside crates/<pkg>/** fails safe
# to the full selection — CI/scripts/vendor/runtime changes affect the
# whole suite, and docs-only waste is cheaper than a silent hole). The
# stable crc32 shard assignment is untouched — only the unit selection
# narrows — and the merge-queue and dispatch waves run the full union: the
# PR proves the touched crates' runtime behavior fast, the merge proves the
# whole workspace. fmt + check/clippy stay full-scope on
# PRs (the compile authority); reverse-dep selection also runs tests of
# crates affected by a dependency's behavior change. The shard manifests
# record the selection scope and the summary job audits the union against it, so a
# narrowed run can never masquerade as a full one and coverage can never
# silently regress.
#
# The test phase is sharded: the union of SHARD_COUNT parallel shard jobs.
# scripts/ci_test_shard.py enumerates
# the workspace's test binaries via `cargo metadata --no-deps` and each shard
# runs the units whose stable crc32 hash lands in its slice — every binary
# lands in exactly one shard on every run (never rebalanced mid-suite), so
# flake attribution stays put when tests are added or renamed. The union
# covers exactly what the serial `cargo test --workspace` built and ran:
# lib/bin/doc unittests, every tests/ integration target, the
# example/bench compile targets (compile parity, `--no-run`), and the
# workspace bins the serial build left in the profile dir as a side effect
# (each shard links them up front — the e2e suites look each other's
# binaries up there). The summary
# job audits the shard manifests — same enumeration, disjoint shards, every
# assigned unit executed — and merges the failure reports into one table
# naming the failing binaries; the gate is green only when all shards are.
#
# Strictly read-only: contents: read, persist-credentials: false, no secrets.
#
name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # PRs: a newer push supersedes stale gates. Queue entries use their own
  # merge-group ref; a superseded entry's gates can be cancelled. Pushes:
  # the newest tip supersedes the older run instead of billing stale tips.
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # THE shard-count knob: the one declared value of the test phase's shard
  # count. Both manifest tools read it as their --total (the shard legs and
  # the summary audit below), so the audit re-derives exactly the partition
  # the legs ran. A bump is the two adjacent edits: this value + the
  # test-shard matrix leg list; the strategy context cannot read the
  # workflow env, so the count cannot be declared in one place for both.
  # A partial bump cannot pass silently: too few legs leaves units
  # unassigned and the summary audit goes red; too many leaves dead 0-unit
  # legs visible in the summary report (the partition that ran is still
  # audited complete - waste, never a coverage hole).
  # THE ATTRIBUTION RULE (the conductor's 2026-09-29 ruling, 4 -> 8): bump
  # only in powers of two — crc32 % 8 is a bit-refinement of crc32 % 4, so
  # an 8-way shard s contains only units whose 4-way home was
  # ((s-1) % 4) + 1; the flake history stays interpretable and every old
  # manifest stays derivable (measured at the flip: 0/186 units left
  # their 4-way parent).
  SHARD_COUNT: "8"

jobs:
  # The touched-crate path filter (the PR smoke's selection). Queue and
  # dispatch runs use the full selection; PR runs select crates plus reverse deps,
  # failing safe to the full selection on any non-crate path. The output
  # feeds test shards' --crates; empty means "the full union".
  changes:
    name: touched crates (PR) / full selection (queue + dispatch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name != 'push' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    outputs:
      crates: ${{ steps.select.outputs.crates }}
      scope: ${{ steps.select.outputs.scope }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select the touched crates
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "${EVENT_NAME} wave: the full selection"
            echo "crates=" >> "${GITHUB_OUTPUT}"
            echo "scope=all" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # The PR's exact change set: the pulls files API (merge-base
          # semantics, renames carrying both sides), fully paginated —
          # `gh pr view --json files` caps at 100 rows and would silently
          # under-map a large PR, and its field names differ from the REST
          # rows (`path` vs `filename`). The mapping itself is fail-safe
          # by construction (scripts/ci_pr_crates.py + its battery): any
          # non-crate path, a rename's removed side, an empty column, or
          # the API's 3000-file ceiling means the FULL selection runs.
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --paginate --jq '.[] | [.filename, .previous_filename // ""] | @tsv' \
            > "${RUNNER_TEMP}/pr-files.tsv"
          python3 scripts/ci_pr_crates.py "${RUNNER_TEMP}/pr-files.tsv"
      - name: Report the selection
        env:
          SCOPE: ${{ steps.select.outputs.scope }}
          CRATES: ${{ steps.select.outputs.crates }}
        run: |
          set -euo pipefail
          echo "wave selection: ${SCOPE}"
          if [ -n "${CRATES}" ]; then
            echo "crates under test: ${CRATES}"
          fi

  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Draft PRs do not gate (no billing on work-in-progress pushes); the
    # ready_for_review trigger runs the gates once a draft is marked ready.
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1 action pin; the SHA selects the toolchain
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # The dashboard's web app is built from crates/eukhe-dashboard/ui by Vite+
  # into crates/eukhe-dashboard/web, which is committed (cargo and Nix build
  # without Node). Rebuild it and fail when the committed output differs.
  # `vp test` runs the token bridge to bend/tokens.bend, so Bend is installed.
  dashboard-ui:
    name: dashboard UI (vp check + build, web/ up to date)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event_name != 'push' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install Bend (the token bridge runs bend/bridge_tokens.bend)
        uses: ./.github/actions/setup-bend
      - run: make dashboard-ui
        env:
          EUKHE_REQUIRE_BEND: "1"
      - run: git diff --exit-code --stat -- crates/eukhe-dashboard/web
      - run: test -z "$(git status --porcelain -- crates/eukhe-dashboard/web)"

  clippy-test:
    name: check + clippy (workspace)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.event_name != 'push' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1 action pin; the SHA selects the toolchain
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Red gates cache too: an iterating PR keeps its dependency set
          # warm instead of paying a cold rebuild per fix push.
          cache-on-failure: true
      # --locked everywhere: the lockfile is committed, so a PR that changes
      # Cargo.toml without its lockfile in the same push fails here instead
      # of in a teammate's local build.
      # --all-targets compiles the test/bench/example targets the release
      # builds never touch (#2632's missed `initial_images` fixture was
      # exactly this class: a latent test-target compile break no workflow
      # could see).
      - name: Check (workspace, all targets, locked)
        run: cargo check --workspace --all-targets --locked
      - name: Clippy (workspace, all targets, deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # The test suite, sharded per the SHARD_COUNT knob above: each shard runs
  # the test binaries whose stable crc32 hash lands in its slice
  # (scripts/ci_test_shard.py); fmt and clippy run above, a shard job runs
  # ONLY its test subset. The union of the shards is exactly the old serial
  # `cargo test --workspace`.
  test-shard:
    # The shard legs need the wave's selection (the changes job's crates
    # output) before they can decide what to run — and whether the
    # sibling-binary build is needed at all.
    needs: changes
    # strategy.job-total (the matrix leg count) auto-derives the displayed
    # total; the env context is not reachable from a job name.
    name: test shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.event_name != 'push' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    strategy:
      # One red shard must not cancel the others: their own conclusions are
      # the per-shard signal the summary merges.
      fail-fast: false
      matrix:
        # The leg list is the partition's other half: it must stay in
        # lockstep with SHARD_COUNT (see the env block for why one value
        # cannot drive both, and what a partial bump does).
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1 action pin; the SHA selects the toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          # One shared dependency cache for all legs: per-shard keys held
          # 8x ~500 MB per ref and evicted the release-build caches (the
          # repo sits at the 10 GB Actions-cache quota; the shards were 83%
          # of it). The shards' dev-dependencies differ, and whichever leg
          # saves first defines the shared entry, so other legs get a
          # partial hit and compile the rest. Slower hits, no correctness
          # issue.
          shared-key: test-shards
          # Only a run on main (a workflow_dispatch of main; pushes run no
          # shards) writes the entry: PR and merge-queue legs restore (the
          # restore key falls back to main's entry) and save nothing - a
          # PR's save would land under the PR's own ref, and PR-ref entries
          # are the eviction pressure on the release-build caches.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Pinned uv release, checked against its published sha256
      # (https://github.com/astral-sh/uv/releases/download/0.12.23/uv-x86_64-unknown-linux-gnu.tar.gz.sha256).
      # No Actions cache: the uv cache would carry state between runs.
      # The real-kernel tests build their kernel venv from
      # eukhe-runtime/uv.lock with it (crates/eukhe-core/tests/support/kernel_runtime.rs).
      - name: Install uv (the real-kernel tests build their venv with it)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          checksum: 9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6
          enable-cache: false
      # The pinned, sha256-checked Bend release: the Rust-vs-Bend bridge
      # tests compare Rust code with its Bend model and must not skip here.
      - name: Install Bend (the bridge tests run the Bend models)
        uses: ./.github/actions/setup-bend
      # The wave's selection, resolved once per leg before anything builds:
      # the narrowed selection's unit list decides whether the bins build
      # below has any work to do (an empty selection runs no units and needs
      # no sibling binaries).
      - name: Resolve this shard's selection
        id: selection
        env:
          SHARD: ${{ matrix.shard }}
          CRATES: ${{ needs.changes.outputs.crates }}
        run: |
          set -euo pipefail
          python3 scripts/ci_test_shard.py --shard "${SHARD}" --total "${SHARD_COUNT}" --crates "${CRATES}" --print-selection
      # Sibling-binary parity: the serial `cargo test --workspace` built every
      # workspace bin into the shared profile dir as a side effect, and the
      # e2e suites look each other's binaries up there (eukhe-cli's
      # daemon_commands_e2e spawns eukhe-daemon this way). A shard builds its
      # test subset only, so the bins are built explicitly once up front —
      # first measured on run 36085993711, where the missing eukhe-daemon bin
      # failed exactly this suite. A leg with no selected units skips this
      # (and runs nothing below); the queue and dispatch waves always
      # select units.
      - name: Build the workspace bins (sibling-binary parity for the e2e suites)
        if: steps.selection.outputs.units != '0'
        run: cargo build --locked --workspace --bins
      - name: Run this shard's test subset
        env:
          SHARD: ${{ matrix.shard }}
          CRATES: ${{ needs.changes.outputs.crates }}
          EUKHE_REQUIRE_BEND: "1"
        run: |
          python3 scripts/ci_test_shard.py --shard "${SHARD}" --total "${SHARD_COUNT}" --crates "${CRATES}" --manifest "${RUNNER_TEMP}/shard-manifest-${SHARD}.json"
      - name: Upload the shard manifest (always — the summary audits it)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shard-manifest-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-manifest-${{ matrix.shard }}.json

  # The aggregate: audits the partition (same enumeration everywhere,
  # disjoint shards, every assigned unit executed — coverage can never
  # silently regress) and merges the per-shard failure reports into one
  # table naming the failing binaries. Green only when every shard is green.
  test-summary:
    name: test summary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: test-shard
    if: always() && github.event_name != 'push' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: shard-manifest-*
          merge-multiple: true
          path: manifests
      - name: Audit the shards and merge their failure reports
        run: python3 scripts/ci_test_shard_summary.py --total "${SHARD_COUNT}" --dir manifests

  # The laws (LAWS.bend): `bend PROOF.bend` checks every proof, and
  # `--verdict` checks them again with the BendTT kernel, which Bend builds
  # with the pinned Lean release. The release-version rule
  # (scripts/release/next_version.py) runs its tests and its bridge to the
  # Bend model here.
  laws:
    name: laws (bend PROOF.bend, --verdict, release-version bridge)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Bend (pinned release, sha256-checked)
        uses: ./.github/actions/setup-bend
      # A law file that LAWS.bend does not import, or a law with no fill in
      # the PROOF.bend import closure, is a law bend never checks.
      - name: Every law file is imported and every law is filled
        run: python3 scripts/check_laws_wired.py .
      - name: Check the proofs
        run: |
          set -euo pipefail
          bend PROOF.bend | tee "${RUNNER_TEMP}/proof.out"
          grep -qx 'ALL PROOFS CHECK' "${RUNNER_TEMP}/proof.out"
      # Before Lean: Lean's bin directory carries its own clang, without the
      # C headers (stdbool.h) that the bridge's `bend -o` build needs.
      - name: The release-version rule and its bridge to bend/semver.bend
        env:
          EUKHE_REQUIRE_BEND: "1"
        run: python3 scripts/release/test_next_version.py
      - name: Install Lean (pinned release, sha256-checked) for --verdict
        uses: ./.github/actions/setup-bend
        with:
          lean: "true"
      - name: Check the proofs with the BendTT kernel
        run: |
          set -euo pipefail
          bend PROOF.bend --verdict | tee "${RUNNER_TEMP}/verdict.out"
          grep -qx 'ALL PROOFS CHECK' "${RUNNER_TEMP}/verdict.out"

  # The supply-chain deny gate:
  #
  #   deny — cargo-deny advisories + bans + licenses + sources, the CI
  #   mirror of `make deny`. The advisory DB drifts daily, so a drifted
  #   advisory can gate PRs — that is the accepted trade.
  # The eukhe-runtime Python suite (`make runtime-test`) on the uv-locked
  # kernel env.
  runtime-test:
    name: runtime tests (eukhe-runtime)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name != 'push' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # The same pinned, checksummed uv release as the test shards.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          checksum: 9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6
          enable-cache: false
      - name: Run the eukhe-runtime suite
        run: make runtime-test

  deny:
    name: deny (cargo-deny advisories + bans + licenses + sources)
    if: (github.event_name == 'push' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_DENY_VERSION: 0.20.2
      # https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz.sha256
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install cargo-deny (pinned release, sha256-checked)
        run: |
          set -euo pipefail
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl --proto '=https' --tlsv1.2 -fsSL -o "${RUNNER_TEMP}/${name}.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz"
          echo "${CARGO_DENY_SHA256}  ${RUNNER_TEMP}/${name}.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${name}.tar.gz" -C "${RUNNER_TEMP}" "${name}/cargo-deny"
          echo "${RUNNER_TEMP}/${name}" >> "${GITHUB_PATH}"
      - name: Dependency audit (cargo-deny advisories + bans + licenses + sources)
        run: cargo deny --all-features --workspace check advisories bans licenses sources

  # The secrets scan: gitleaks (pinned release, sha256-checked) over the
  # commits the event adds, with the default rules less the test fixtures
  # that .gitleaks.toml names. The local hooks run the same scan.
  secrets:
    name: secrets (gitleaks, the new commits)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    env:
      GITLEAKS_VERSION: 8.30.1
      # https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # The full history and the tags: the scan range starts at the
          # event's base commit, or else after the release tags.
          fetch-depth: 0
      - name: Install gitleaks (pinned release, sha256-checked)
        run: |
          set -euo pipefail
          name="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          dir="${RUNNER_TEMP}/gitleaks"
          mkdir -p "${dir}"
          curl --proto '=https' --tlsv1.2 -fsSL -o "${dir}/${name}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${name}"
          echo "${GITLEAKS_SHA256}  ${dir}/${name}" | sha256sum -c -
          tar -xzf "${dir}/${name}" -C "${dir}" gitleaks
          echo "${dir}" >> "${GITHUB_PATH}"
      - name: Scan the new commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          case "${EVENT_NAME}" in
            push) base="${PUSH_BEFORE}" ;;
            pull_request) base="${PR_BASE}"; head="${PR_HEAD}" ;;
            merge_group) base="${QUEUE_BASE}" ;;
            *) base="" ;;
          esac
          # A new branch (base all zeros), a force push (base not in the
          # history) or a dispatch: every commit after the release tags.
          if [[ -n "${base}" && ! "${base}" =~ ^0+$ ]] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            range="${base}..${head}"
          else
            range="${head} --not --tags"
          fi
          echo "scanning: ${range}"
          gitleaks git --redact --no-banner --config .gitleaks.toml --log-opts="${range}" .
