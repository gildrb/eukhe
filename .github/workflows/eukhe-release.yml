# eukhe releases: the four Unix targets built and packaged with the
# repository's own release scripts, published as a GitHub release.
#
# At most one release a day: a daily schedule (03:17 UTC) and
# workflow_dispatch (an urgent release) release the newest commit of main
# (first-parent history). GitHub runs no gate on it: the full gate ran
# before the push, in the local pre-push hook (prek: `make ci-local`).
# When that commit, or
# a newer one, already has an `eukhe-v*` tag, nothing is released (a re-run
# of a published release changes nothing). The build jobs build that exact
# commit. The version is the next patch of the workspace series (Cargo.toml
# X.Y.0 at that commit): scripts/release/next_version.py, the rule
# bend/semver.bend models and LAWS.bend section R1 (Release versions) proves. The
# release is tagged `eukhe-v<version>`, titled `Eukhe v<version>`, marked
# latest (mise installs it), and pinned for the Nix flake (nix/release.json:
# url + SRI hash per system). One release runs at a time (the concurrency
# group), so two never compute the same version. The nix/release.json
# commit is made with the workflow's token, which starts no workflow; the
# version job skips it, so it is never released.
#
# Supply chain: every action is pinned by full commit SHA; the build jobs
# use no cache (a poisoned cache would ride the shipped binary); apt
# installs come from a fixed snapshot.ubuntu.com timestamp; rustup-init is
# a pinned version checked against committed sha256; the bundled catalog
# is the commit pinned in scripts/release/catalog-pin.json, hash-checked;
# builds set SOURCE_DATE_EPOCH and remap the workspace and cargo home
# paths; crates are fetched first and the build itself runs offline
# (--frozen); publish attests build provenance for every release asset.
name: eukhe-release

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

# One release at a time, never cancelled: the version job reads the tags
# the previous release created. A newer pending run replaces an older
# pending one; it picks its commit when it starts.
concurrency:
  group: eukhe-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release: ${{ steps.version.outputs.release }}
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      title: ${{ steps.version.outputs.title }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: version
        name: The commit to release and its version (the next patch of the workspace series)
        run: |
          set -euo pipefail
          git ls-remote --tags --refs origin > "${RUNNER_TEMP}/tags"
          # The newest first-parent commit of main. A tagged commit ends the
          # search: it and every older commit are released.
          sha=""
          while read -r commit; do
            released="$(awk -v sha="${commit}" '$1 == sha && $2 ~ /^refs\/tags\/eukhe-v/ { sub(/^refs\/tags\//, "", $2); print $2 }' "${RUNNER_TEMP}/tags")"
            if [[ -n "${released}" ]]; then
              echo "::notice::${commit} is already released (${released//$'\n'/, }); main has no newer commit"
              break
            fi
            [[ "$(git log -1 --format=%s "${commit}")" == "nix: release.json for "* ]] && continue
            sha="${commit}"
            break
          done < <(git rev-list --first-parent --max-count=500 HEAD)
          if [[ -z "${sha}" ]]; then
            echo "release=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "releasing ${sha}"
          git checkout --quiet --detach "${sha}"
          cut -f2 "${RUNNER_TEMP}/tags" | sed 's|^refs/tags/||' | python3 scripts/release/next_version.py > "${RUNNER_TEMP}/version"
          cat "${RUNNER_TEMP}/version"
          {
            cat "${RUNNER_TEMP}/version"
            echo "sha=${sha}"
            echo "release=true"
          } >> "${GITHUB_OUTPUT}"

  build-linux:
    needs: version
    if: needs.version.outputs.release == 'true'
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    # The glibc 2.35 baseline (Ubuntu 22.04). buildpack-deps:jammy-curl is
    # ubuntu:22.04 plus ca-certificates and curl, so the pinned snapshot
    # below is reachable over verified TLS without an unpinned bootstrap.
    container:
      image: buildpack-deps:jammy-curl@sha256:6326f638affaad95fcc68973d732ecee04d8746fd1529ec113e88c76be9b3ad0
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-24.04
            alias: linux-x64
            # https://static.rust-lang.org/rustup/archive/<RUSTUP_VERSION>/<target>/rustup-init.sha256
            rustup-init-sha256: dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71
          - target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-24.04-arm
            alias: linux-arm64
            rustup-init-sha256: 15f6e4ce9f583b929c996c91562bad6d4454f3281de858b02cdfdef615fac433
    env:
      COPYFILE_DISABLE: "1"
      VERSION: ${{ needs.version.outputs.version }}
      # The version the binary reports (eukhe-build-info).
      EUKHE_RELEASE_VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
      # The Ubuntu archive as of this instant (snapshot.ubuntu.com serves
      # amd64 and arm64 under the same path). Move it forward by editing
      # this value; it must not predate the container image build.
      UBUNTU_SNAPSHOT: 20261005T000000Z
      RUSTUP_VERSION: 1.29.1
    steps:
      - name: Install build prerequisites (Ubuntu 22.04 snapshot)
        run: |
          set -euo pipefail
          rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
          for suite in jammy jammy-updates jammy-security; do
            echo "deb https://snapshot.ubuntu.com/ubuntu/${UBUNTU_SNAPSHOT} ${suite} main universe"
          done > /etc/apt/sources.list
          # The snapshot server answers 5xx in bursts: each fetch retries
          # with backoff, and an index that still fails stops the update
          # here instead of as "Unable to locate package" below.
          echo 'Acquire::Retries "10";' > /etc/apt/apt.conf.d/80-retries
          apt-get update --error-on=any
          apt-get install -y --no-install-recommends build-essential python3 git binutils
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - name: Install Rust (pinned rustup-init, sha256-checked; toolchain from rust-toolchain.toml)
        env:
          RUSTUP_INIT_SHA256: ${{ matrix.rustup-init-sha256 }}
        run: |
          set -euo pipefail
          init="${RUNNER_TEMP}/rustup-init"
          curl --proto '=https' --tlsv1.2 -fsSL -o "${init}" \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/${TARGET}/rustup-init"
          echo "${RUSTUP_INIT_SHA256}  ${init}" | sha256sum -c -
          chmod +x "${init}"
          "${init}" -y --no-modify-path --profile minimal --default-toolchain none
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          "${HOME}/.cargo/bin/rustup" toolchain install --no-self-update
          "${HOME}/.cargo/bin/rustup" target add "${TARGET}"
      - name: Reproducible build environment
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          {
            echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)"
            echo "RUSTFLAGS=--remap-path-prefix=${GITHUB_WORKSPACE}=/eukhe --remap-path-prefix=${HOME}/.cargo=/cargo -C link-arg=-Wl,--build-id"
          } >> "${GITHUB_ENV}"
      # Network stops here: every crate is fetched and checked against the
      # Cargo.lock checksums, then the build runs offline (--frozen).
      - name: Fetch dependencies (locked, checksummed)
        run: cargo fetch --locked --target "${TARGET}"
      - name: Build (release, frozen, offline)
        # The build identity names the released commit.
        env:
          EUKHE_BUILD_COMMIT: ${{ needs.version.outputs.sha }}
        run: cargo build --release --frozen --target "${TARGET}" -j 4 -p eukhe-cli --bin eukhe
      - name: Split the shipped binary and its debug decoder
        run: |
          set -euo pipefail
          python3 scripts/release/split_debug.py \
            --binary "target/${TARGET}/release/eukhe" \
            --shipped "target/${TARGET}/dist/eukhe" \
            --out "target/${TARGET}/dist" \
            --version "${VERSION}" \
            --target "${TARGET}"
      - name: "Livecheck: --version prints the release version"
        run: |
          set -euo pipefail
          out="$("target/${TARGET}/dist/eukhe" --version)"
          [[ "${out}" == "${VERSION}" ]] || { echo "::error::binary reports '${out}', expected '${VERSION}'"; exit 1; }
      - name: "GLIBC baseline: no symbol above GLIBC_2.35"
        run: |
          set -euo pipefail
          syms="$(objdump -T "target/${TARGET}/dist/eukhe" | grep -o 'GLIBC_[0-9.]*' || true)"
          [[ -n "${syms}" ]] || { echo "::error::no GLIBC symbols found"; exit 1; }
          max_glibc="$(printf '%s\n' "${syms}" | sort -Vu | tail -1)"
          top="$(printf '%s\nGLIBC_2.35\n' "${max_glibc}" | sort -Vu | tail -1)"
          [[ "${top}" == "GLIBC_2.35" ]] || { echo "::error::binary requires ${max_glibc}"; exit 1; }
      - name: Generate bundled catalog assets (pinned catalog commit, sha256-checked)
        run: python3 scripts/release/bundle_catalog.py generate --network --out "target/${TARGET}/catalog-assets"
      - name: Assemble tarball, checksums, manifest
        run: |
          set -euo pipefail
          python3 scripts/release/assemble_artifacts.py \
            --repo-root . \
            --version "${VERSION}" \
            --target "${TARGET}" \
            --binary "target/${TARGET}/dist/eukhe" \
            --decoder "target/${TARGET}/dist/eukhe-${VERSION}-${{ matrix.alias }}.debug.gz" \
            --catalog-assets "target/${TARGET}/catalog-assets" \
            --out-dir "target/${TARGET}/dist"
          python3 scripts/release/verify_release.py --dist-dir "target/${TARGET}/dist" --version "${VERSION}" --target "${TARGET}"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/dist/eukhe-*
            target/${{ matrix.target }}/dist/SHA256SUMS
            target/${{ matrix.target }}/dist/manifest.json
          if-no-files-found: error

  build-darwin:
    needs: version
    if: needs.version.outputs.release == 'true'
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runs-on: macos-14
    env:
      COPYFILE_DISABLE: "1"
      VERSION: ${{ needs.version.outputs.version }}
      # The version the binary reports (eukhe-build-info).
      EUKHE_RELEASE_VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      # The runner image ships rustup; refusing to continue without it keeps
      # the job off any curl | sh install path.
      - name: Install Rust (runner rustup; toolchain from rust-toolchain.toml)
        run: |
          set -euo pipefail
          command -v rustup >/dev/null || { echo "::error::rustup is not preinstalled on ${RUNNER_OS}"; exit 1; }
          rustup toolchain install --no-self-update
          rustup target add "${TARGET}"
      - name: Reproducible build environment
        run: |
          set -euo pipefail
          {
            echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)"
            echo "RUSTFLAGS=--remap-path-prefix=${GITHUB_WORKSPACE}=/eukhe --remap-path-prefix=${CARGO_HOME:-${HOME}/.cargo}=/cargo"
          } >> "${GITHUB_ENV}"
      - name: Fetch dependencies (locked, checksummed)
        run: cargo fetch --locked --target "${TARGET}"
      - name: Build (release, frozen, offline)
        # The build identity names the released commit.
        env:
          EUKHE_BUILD_COMMIT: ${{ needs.version.outputs.sha }}
        run: cargo build --release --frozen --target "${TARGET}" -j 4 -p eukhe-cli --bin eukhe
      - name: "Livecheck: --version prints the release version"
        run: |
          set -euo pipefail
          out="$("target/${TARGET}/release/eukhe" --version)"
          [[ "${out}" == "${VERSION}" ]] || { echo "::error::binary reports '${out}', expected '${VERSION}'"; exit 1; }
      - name: Generate bundled catalog assets (pinned catalog commit, sha256-checked)
        run: python3 scripts/release/bundle_catalog.py generate --network --out "target/${TARGET}/catalog-assets"
      - name: Assemble tarball, checksums, manifest
        run: |
          set -euo pipefail
          python3 scripts/release/assemble_artifacts.py \
            --repo-root . \
            --version "${VERSION}" \
            --target "${TARGET}" \
            --binary "target/${TARGET}/release/eukhe" \
            --catalog-assets "target/${TARGET}/catalog-assets" \
            --out-dir "target/${TARGET}/dist"
          python3 scripts/release/verify_release.py --dist-dir "target/${TARGET}/dist" --version "${VERSION}" --target "${TARGET}"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/dist/eukhe-*
            target/${{ matrix.target }}/dist/SHA256SUMS
            target/${{ matrix.target }}/dist/manifest.json
          if-no-files-found: error

  publish:
    needs: [version, build-linux, build-darwin]
    runs-on: ubuntu-24.04
    # id-token + attestations: the build provenance attestation below
    # (Sigstore-signed via the workflow's OIDC identity). Only this job
    # holds them.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.tag }}
      TITLE: ${{ needs.version.outputs.title }}
      VERSION: ${{ needs.version.outputs.version }}
      HEAD_SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: incoming
          pattern: artifacts-*
      # The installer of the released commit (https://eukhe.com/install
      # redirects to releases/latest/download/install.sh).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.version.outputs.sha }}
          path: src
          sparse-checkout: install.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify the archives, merge SHA256SUMS, write release.json
        shell: python3 {0}
        run: |
          import base64, hashlib, json, os, pathlib, shutil, sys
          systems = {
              "linux-x64": "x86_64-linux",
              "linux-arm64": "aarch64-linux",
              "darwin-arm64": "aarch64-darwin",
          }
          repo, tag, version = os.environ["GH_REPO"], os.environ["TAG"], os.environ["VERSION"]
          out = pathlib.Path("release-out")
          out.mkdir()
          sums, assets = [], {}
          for directory in sorted(p for p in pathlib.Path("incoming").iterdir() if p.is_dir()):
              manifest = json.loads((directory / "manifest.json").read_text())
              for binary in manifest["binaries"]:
                  data = (directory / binary["file"]).read_bytes()
                  if hashlib.sha256(data).hexdigest() != binary["sha256"]:
                      sys.exit(f"{binary['file']}: sha256 mismatch")
                  shutil.copy2(directory / binary["file"], out / binary["file"])
                  assets[systems[binary["platform"]]] = {
                      "url": f"https://github.com/{repo}/releases/download/{tag}/{binary['file']}",
                      "hash": "sha256-" + base64.b64encode(hashlib.sha256(data).digest()).decode(),
                  }
              for decoder in manifest.get("decoders", []):
                  shutil.copy2(directory / decoder["file"], out / decoder["file"])
              sums += [line for line in (directory / "SHA256SUMS").read_text().splitlines() if line.strip()]
          missing = sorted(set(systems.values()) - set(assets))
          if missing:
              sys.exit(f"missing systems: {missing}")
          (out / "SHA256SUMS").write_text("\n".join(sorted(sums, key=lambda line: line.split()[1])) + "\n")
          release = {"version": version, "tag": tag, "assets": dict(sorted(assets.items()))}
          pathlib.Path("release.json").write_text(json.dumps(release, indent=2) + "\n")
      - name: Attach the installer of the released commit
        run: install -m 0644 src/install.sh release-out/install.sh
      # Verify a downloaded asset: gh attestation verify <file> --repo gildrb/eukhe
      - name: Attest build provenance (every release asset + SHA256SUMS + release.json)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-out/*
            release.json
      - name: Create the GitHub release (tagged at the released commit, marked latest)
        run: gh release create "${TAG}" release-out/* release.json --target "${HEAD_SHA}" --latest --title "${TITLE}" --notes "eukhe ${VERSION}, built from ${HEAD_SHA}; the full gate passed on it in the local pre-push hook."
      - name: Pin the release for the Nix flake (nix/release.json on main)
        run: |
          set -euo pipefail
          # main always has nix/release.json (the stub before the first
          # release); the update must name the blob it replaces. The
          # commit is the workflow token's, so it starts no workflow run;
          # the version job skips it (its subject), so it is never released.
          sha="$(gh api "repos/${GH_REPO}/contents/nix/release.json?ref=main" --jq .sha)"
          gh api -X PUT "repos/${GH_REPO}/contents/nix/release.json" \
            -f "message=nix: release.json for ${TAG}" \
            -f "content=$(base64 -w0 release.json)" \
            -f branch=main \
            -f "sha=${sha}"
