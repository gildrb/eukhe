# eukhe releases: the four Unix targets built and packaged with the
# repository's own release scripts, published as a GitHub release, and
# pinned for the Nix flake (nix/release.json: url + SRI hash per system).
# Upstream's release.yml stays untouched (tests parse it) and disabled in
# this fork; eukhe tags are `eukhe-v<workspace version>`, which never match
# its `v*` triggers.
name: eukhe-release

on:
  push:
    tags: ["eukhe-v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

concurrency:
  group: eukhe-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  tag-check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: version
        name: The tag names the workspace version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#eukhe-v}"
          cargo_version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          if [[ "${tag_version}" != "${cargo_version}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml ${cargo_version}"
            exit 1
          fi
          echo "version=${cargo_version}" >> "${GITHUB_OUTPUT}"

  build-linux:
    needs: tag-check
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    # The glibc 2.35 baseline (Ubuntu 22.04), as upstream's release builds.
    container:
      image: ubuntu:22.04@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-24.04
            alias: linux-x64
          - target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-24.04-arm
            alias: linux-arm64
    env:
      COPYFILE_DISABLE: "1"
      VERSION: ${{ needs.tag-check.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Install build prerequisites (Ubuntu 22.04 container)
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates python3 git binutils
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # The pinned SHA is the toolchain pin (Rust 1.98.1), as upstream.
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}-glibc235
      - name: Build (release, locked)
        run: cargo build --release --locked --target "${TARGET}" -j 4 -p pa-cli --bin prime-agent
      - name: Split the shipped binary and its debug decoder
        run: |
          set -euo pipefail
          python3 scripts/release/split_debug.py \
            --binary "target/${TARGET}/release/prime-agent" \
            --shipped "target/${TARGET}/dist/prime-agent" \
            --out "target/${TARGET}/dist" \
            --version "${VERSION}" \
            --target "${TARGET}"
      - name: "Livecheck: --version prints the tag version"
        run: |
          set -euo pipefail
          out="$("target/${TARGET}/dist/prime-agent" --version)"
          [[ "${out}" == "${VERSION}" ]] || { echo "::error::binary reports '${out}', expected '${VERSION}'"; exit 1; }
      - name: "GLIBC baseline: no symbol above GLIBC_2.35"
        run: |
          set -euo pipefail
          syms="$(objdump -T "target/${TARGET}/dist/prime-agent" | grep -o 'GLIBC_[0-9.]*' || true)"
          [[ -n "${syms}" ]] || { echo "::error::no GLIBC symbols found"; exit 1; }
          max_glibc="$(printf '%s\n' "${syms}" | sort -Vu | tail -1)"
          top="$(printf '%s\nGLIBC_2.35\n' "${max_glibc}" | sort -Vu | tail -1)"
          [[ "${top}" == "GLIBC_2.35" ]] || { echo "::error::binary requires ${max_glibc}"; exit 1; }
      - name: Generate bundled catalog assets (fixture, offline-safe)
        run: python3 scripts/release/bundle_catalog.py generate --fixture --out "target/${TARGET}/catalog-assets"
      - name: Assemble tarball, checksums, manifest
        run: |
          set -euo pipefail
          python3 scripts/release/assemble_artifacts.py \
            --repo-root . \
            --version "${VERSION}" \
            --target "${TARGET}" \
            --binary "target/${TARGET}/dist/prime-agent" \
            --decoder "target/${TARGET}/dist/prime-agent-${VERSION}-${{ matrix.alias }}.debug.gz" \
            --catalog-assets "target/${TARGET}/catalog-assets" \
            --out-dir "target/${TARGET}/dist"
          python3 scripts/release/verify_release.py --dist-dir "target/${TARGET}/dist" --version "${VERSION}" --target "${TARGET}"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/dist/prime-agent-*
            target/${{ matrix.target }}/dist/SHA256SUMS
            target/${{ matrix.target }}/dist/manifest.json
          if-no-files-found: error

  build-darwin:
    needs: tag-check
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runs-on: macos-14
          # Cross-compiled on Apple silicon; the livecheck runs it under
          # Rosetta 2, as upstream.
          - target: x86_64-apple-darwin
            runs-on: macos-15
    env:
      COPYFILE_DISABLE: "1"
      VERSION: ${{ needs.tag-check.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      - name: Build (release, locked)
        run: cargo build --release --locked --target "${TARGET}" -j 4 -p pa-cli --bin prime-agent
      - name: "Livecheck: --version prints the tag version"
        run: |
          set -euo pipefail
          out="$("target/${TARGET}/release/prime-agent" --version)"
          [[ "${out}" == "${VERSION}" ]] || { echo "::error::binary reports '${out}', expected '${VERSION}'"; exit 1; }
      - name: Generate bundled catalog assets (fixture, offline-safe)
        run: python3 scripts/release/bundle_catalog.py generate --fixture --out "target/${TARGET}/catalog-assets"
      - name: Assemble tarball, checksums, manifest
        run: |
          set -euo pipefail
          python3 scripts/release/assemble_artifacts.py \
            --repo-root . \
            --version "${VERSION}" \
            --target "${TARGET}" \
            --binary "target/${TARGET}/release/prime-agent" \
            --catalog-assets "target/${TARGET}/catalog-assets" \
            --out-dir "target/${TARGET}/dist"
          python3 scripts/release/verify_release.py --dist-dir "target/${TARGET}/dist" --version "${VERSION}" --target "${TARGET}"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/dist/prime-agent-*
            target/${{ matrix.target }}/dist/SHA256SUMS
            target/${{ matrix.target }}/dist/manifest.json
          if-no-files-found: error

  publish:
    needs: [tag-check, build-linux, build-darwin]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.tag-check.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: incoming
          pattern: artifacts-*
      - name: Verify the archives, merge SHA256SUMS, write release.json
        shell: python3 {0}
        run: |
          import base64, hashlib, json, os, pathlib, shutil, sys
          systems = {
              "linux-x64": "x86_64-linux",
              "linux-arm64": "aarch64-linux",
              "darwin-x64": "x86_64-darwin",
              "darwin-arm64": "aarch64-darwin",
          }
          repo, tag, version = os.environ["GH_REPO"], os.environ["TAG"], os.environ["VERSION"]
          out = pathlib.Path("release-out")
          out.mkdir()
          sums, assets = [], {}
          for directory in sorted(p for p in pathlib.Path("incoming").iterdir() if p.is_dir()):
              manifest = json.loads((directory / "manifest.json").read_text())
              for binary in manifest["binaries"]:
                  data = (directory / binary["file"]).read_bytes()
                  if hashlib.sha256(data).hexdigest() != binary["sha256"]:
                      sys.exit(f"{binary['file']}: sha256 mismatch")
                  shutil.copy2(directory / binary["file"], out / binary["file"])
                  assets[systems[binary["platform"]]] = {
                      "url": f"https://github.com/{repo}/releases/download/{tag}/{binary['file']}",
                      "hash": "sha256-" + base64.b64encode(hashlib.sha256(data).digest()).decode(),
                  }
              for decoder in manifest.get("decoders", []):
                  shutil.copy2(directory / decoder["file"], out / decoder["file"])
              sums += [line for line in (directory / "SHA256SUMS").read_text().splitlines() if line.strip()]
          missing = sorted(set(systems.values()) - set(assets))
          if missing:
              sys.exit(f"missing systems: {missing}")
          (out / "SHA256SUMS").write_text("\n".join(sorted(sums, key=lambda line: line.split()[1])) + "\n")
          release = {"version": version, "tag": tag, "assets": dict(sorted(assets.items()))}
          pathlib.Path("release.json").write_text(json.dumps(release, indent=2) + "\n")
      - name: Create the GitHub release
        run: gh release create "${TAG}" release-out/* release.json --verify-tag --title "${TAG}" --notes "eukhe ${VERSION}"
      - name: Pin the release for the Nix flake (nix/release.json on main)
        run: |
          set -euo pipefail
          # main always has nix/release.json (the stub before the first
          # release); the update must name the blob it replaces.
          sha="$(gh api "repos/${GH_REPO}/contents/nix/release.json?ref=main" --jq .sha)"
          gh api -X PUT "repos/${GH_REPO}/contents/nix/release.json" \
            -f "message=nix: release.json for ${TAG}" \
            -f "content=$(base64 -w0 release.json)" \
            -f branch=main \
            -f "sha=${sha}"
