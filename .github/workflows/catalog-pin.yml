# Weekly catalog pin: moves scripts/release/catalog-pin.json to the newest
# commit of the catalog repo's main (PrimeIntellect-ai/prime-agent-catalog)
# and opens a pull request for it.
#
# `bundle_catalog.py pin` resolves the commit, fetches both catalog files
# at it, runs the full validation gates, and records the commit and both
# sha256 (the release workflow fetches exactly these bytes). When the pin
# is already at the newest commit, the run changes nothing. Else the
# `catalog-pin` branch restarts at main's tip with one commit (the new
# pin), and one pull request carries it; a later run updates the same
# branch and pull request.
#
# A pull request that the workflow token opens starts no pull_request
# run, so the job then starts ci.yml on the branch (workflow_dispatch, the
# one event the token may start): ci's checks land on the pull request's
# head commit as usual. A push to the branch with any other credential
# runs ci.yml's pull_request gates too.
#
# The repository setting "Allow GitHub Actions to create and approve pull
# requests" must be on for the token to open the pull request.
#
# Supply chain: every action is pinned by full commit SHA; no cache; the
# checkout keeps no credentials (the gh calls take the token from the
# environment); the catalog fetches carry no token (the repo is public).
name: catalog-pin

on:
  schedule:
    # Mondays, 05:17 UTC.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: catalog-pin
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # contents: the branch and its commit; pull-requests: the pull
    # request; actions: the ci.yml run on the branch.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      BRANCH: catalog-pin
      PIN: scripts/release/catalog-pin.json
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Move the pin to the catalog's newest commit (validated, sha256 recorded)
        run: python3 scripts/release/bundle_catalog.py pin --ref main
      - name: Open or update the pull request, then run ci on it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if git diff --quiet -- "${PIN}"; then
            echo "The pin is at the catalog's newest commit."
            exit 0
          fi
          git diff -- "${PIN}"
          old="$(git show "HEAD:${PIN}" | python3 -c 'import json, sys; print(json.load(sys.stdin)["commit"])')"
          new="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["commit"])' "${PIN}")"
          catalog="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["repository"])' "${PIN}")"
          base="$(git rev-parse HEAD)"
          # The branch restarts at main's tip: one commit, the new pin.
          if gh api "repos/${GH_REPO}/git/ref/heads/${BRANCH}" > /dev/null 2>&1; then
            gh api -X PATCH "repos/${GH_REPO}/git/refs/heads/${BRANCH}" -f "sha=${base}" -F force=true > /dev/null
          else
            gh api -X POST "repos/${GH_REPO}/git/refs" -f "ref=refs/heads/${BRANCH}" -f "sha=${base}" > /dev/null
          fi
          blob="$(gh api "repos/${GH_REPO}/contents/${PIN}?ref=${BRANCH}" --jq .sha)"
          title="Move the catalog pin to ${catalog}@${new:0:12}"
          body="The weekly catalog pin (.github/workflows/catalog-pin.yml): ${PIN} moves from ${old} to ${new}, the newest commit of ${catalog} main (https://github.com/${catalog}/compare/${old}...${new}). Both files passed the validation gates; the pin records their sha256. The release bundles this catalog; the built-in catalog is its union with the compiled one."
          gh api -X PUT "repos/${GH_REPO}/contents/${PIN}" \
            -f "message=${title}" \
            -f "content=$(base64 -w0 "${PIN}")" \
            -f "branch=${BRANCH}" \
            -f "sha=${blob}" > /dev/null
          open="$(gh pr list --head "${BRANCH}" --base main --state open --json number --jq '.[].number')"
          if [[ -z "${open}" ]]; then
            gh pr create --base main --head "${BRANCH}" --title "${title}" --body "${body}"
          else
            gh pr edit "${open}" --title "${title}" --body "${body}"
          fi
          gh workflow run ci.yml --ref "${BRANCH}"
