# The pinned Bend release (2.0.37) for a CI job, checked against the
# sha256 digest GitHub publishes for each release asset, on PATH with
# BEND_NO_TELEMETRY=1. With `lean: true`, also the pinned Lean release
# (4.34.0) that `bend --verdict` builds its BendTT kernel with, checked
# the same way. Every Bend-using job installs it with this action.
#
# Digests: gh release view v2.0.37 -R bendlang/bend --json assets
#          gh release view v4.34.0 -R leanprover/lean4 --json assets
# Moving a version means replacing every digest below.
name: Setup Bend
description: Install the pinned Bend release (and optionally the pinned Lean), sha256-checked.
inputs:
  lean:
    description: Also install the pinned Lean release that `bend --verdict` needs ("true" or "false").
    default: "false"
runs:
  using: composite
  steps:
    - name: Install Bend 2.0.37 (sha256-checked)
      shell: bash
      run: |
        set -euo pipefail
        version=2.0.37
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)   platform=linux-x64;    sum=84c32465a39bc9ac315eade23f470cb8db03153dc860f89564fcfec153c3e445 ;;
          Linux-ARM64) platform=linux-arm64;  sum=b65d452e5c68a4c486e353220d4298ba5d76f535db47109a7d76ffdf72efafb1 ;;
          macOS-ARM64) platform=darwin-arm64; sum=846d25ccf0c12d5d1e5e648c0b3ba4c8397fdb852812ac00ef8135998f8e194b ;;
          macOS-X64)   platform=darwin-x64;   sum=93eea3f54b7b91f28ea15a1b9f2d825afa58c1fcd417c11024a62f8c3506b813 ;;
          *) echo "::error::no pinned Bend ${version} for ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
        esac
        dir="${RUNNER_TEMP}/bend-toolchain"
        mkdir -p "${dir}"
        archive="${dir}/bend-${version}-${platform}.tar.gz"
        curl --proto '=https' --tlsv1.2 -fsSL -o "${archive}" \
          "https://github.com/bendlang/bend/releases/download/v${version}/bend-${version}-${platform}.tar.gz"
        echo "${sum}  ${archive}" | shasum -a 256 -c -
        tar -xzf "${archive}" -C "${dir}" 2>/dev/null
        echo "${dir}/bend/bin" >> "${GITHUB_PATH}"
        echo "BEND_NO_TELEMETRY=1" >> "${GITHUB_ENV}"
    - name: Install Lean 4.34.0 (sha256-checked)
      if: inputs.lean == 'true'
      shell: bash
      run: |
        set -euo pipefail
        version=4.34.0
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)   platform=linux;         sum=caaa98356098c85dc0fcbbd28e1ec66f39eb6551829972b752ff20e1286b646b ;;
          Linux-ARM64) platform=linux_aarch64; sum=40b04fdb7fb849d3c80e10c3bbeebc7b7354b6d3f07450b9168c2149b40d2a82 ;;
          *) echo "::error::no pinned Lean ${version} for ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
        esac
        dir="${RUNNER_TEMP}/bend-toolchain"
        archive="${dir}/lean-${version}-${platform}.tar.zst"
        curl --proto '=https' --tlsv1.2 -fsSL -o "${archive}" \
          "https://github.com/leanprover/lean4/releases/download/v${version}/lean-${version}-${platform}.tar.zst"
        echo "${sum}  ${archive}" | shasum -a 256 -c -
        tar --zstd -xf "${archive}" -C "${dir}"
        echo "${dir}/lean-${version}-${platform}/bin" >> "${GITHUB_PATH}"
    - name: Bend on PATH
      shell: bash
      run: command -v bend
