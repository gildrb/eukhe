# eukhe-runtime (rlm.skill) is always installed in the kernel venv before
# skills, so it is intentionally not declared as a dependency (it is not
# published on any package index).
[project]
name = "eukhe-skill-websearch"
version = "0.1.0"
description = "Web search skill for Eukhe (Google search via Serper API)."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
websearch = "rlm.skill:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/websearch"]
