# Kernel-side package for the bundled autoresearch skill. It only talks to
# the host through rlm.host_request; eukhe-runtime is always installed in
# the kernel venv before skills, so it is intentionally not declared as a
# dependency (it is not published on PyPI).
[project]
name = "autoresearch"
version = "0.1.0"
description = "Eukhe autoresearch skill: an experiment loop that keeps only measured improvements"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoresearch"]
